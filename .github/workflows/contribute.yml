---
name: Contribute Redhat forks

on:
  schedule:
    # Every 3 hours
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  contribute:
    uses: ./.github/workflows/contribute-run.yml
    secrets: inherit
    with:
      final_commit_message: "chore: final state update after contributor run"
