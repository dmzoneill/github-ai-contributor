---
name: Contribute my forks

on:
  schedule:
    # Every 3 hours, offset 1.5h from the Redhat workflow
    - cron: "30 1,4,7,10,13,16,19,22 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  contribute:
    uses: ./.github/workflows/contribute-run.yml
    secrets: inherit
    with:
      final_commit_message: "chore: final state update after dmz contributor run"
